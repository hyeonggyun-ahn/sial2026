<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf9f7"><meta name="apple-mobile-web-app-capable" content="yes"><title>SIAL 2026 부스 노트</title><link rel="apple-touch-icon" href="sempio.png"><style>body{margin:0}</style></head><body><script src="config.js"></script><script src="supabase-shim.js"></script><title>SIAL 2026 부스 노트</title>
<style>
:root{
  --bg:#f6f5f2; --card:#fff; --ink:#191714; --ink2:#5d574e; --ink3:#8d8577;
  --line:#e4e0d8; --line2:#efece6;
  --accent:#b8322c; --accent2:#e07b1a; --ok:#2f7d4f; --blue:#2a5d9f;
  --chip:#f0ede7; --sh:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --r:14px; --safe:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141312; --card:#1e1c1a; --ink:#f0ece5; --ink2:#a9a196; --ink3:#7d766c;
  --line:#312e2a; --line2:#272522; --chip:#2a2724;
  --accent:#e0554e; --accent2:#f0952f; --ok:#4fa876; --blue:#6f9fd8;
  --sh:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#141312; --card:#1e1c1a; --ink:#f0ece5; --ink2:#a9a196; --ink3:#7d766c;
  --line:#312e2a; --line2:#272522; --chip:#2a2724;
  --accent:#e0554e; --accent2:#f0952f; --ok:#4fa876; --blue:#6f9fd8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior-y:none}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",Roboto,"Noto Sans CJK KR","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.55;overflow-x:hidden;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:var(--blue)}
.wrap{max-width:820px;margin:0 auto;padding:0 16px calc(84px + var(--safe))}

/* ---- top bar ---- */
.top{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;min-height:52px}
.back{width:34px;height:34px;border-radius:10px;background:var(--chip);display:grid;place-items:center;flex:none;font-size:17px}
.ttl{font-weight:700;font-size:16px;letter-spacing:-.02em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12px;color:var(--ink3);font-weight:500}

/* ---- search ---- */
.sbox{position:relative;margin:12px 0}
.sbox input{width:100%;padding:12px 38px 12px 40px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);font-size:16px;outline:none}
.sbox input:focus{border-color:var(--accent)}
.sbox .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:15px}
.sbox .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;
  border-radius:50%;background:var(--chip);color:var(--ink2);display:none;place-items:center;font-size:13px}
.sbox.has .clr{display:grid}

/* ---- map ---- */
.mapwrap{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--sh);touch-action:none}
.mapin{position:relative;transform-origin:0 0;will-change:transform}
.mapin img{display:block;width:100%;height:auto;pointer-events:none;user-select:none}
.pin{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;
  border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);
  color:#fff;font-weight:800;letter-spacing:-.03em;cursor:pointer}
.pin b{display:block;line-height:1}
.pin i{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
  background:#fff;color:#191714;font-style:normal;font-weight:800;font-size:9px;
  padding:0 4px;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.3);white-space:nowrap}
.mzoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:5}
.mzoom button{width:34px;height:34px;border-radius:9px;background:var(--card);border:1px solid var(--line);
  box-shadow:var(--sh);font-size:17px;font-weight:600;display:grid;place-items:center}
.maphint{font-size:11.5px;color:var(--ink3);text-align:center;margin:7px 0 0}

/* ---- cards / list ---- */
.sect{margin:20px 0 9px;font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.card+.card{margin-top:10px}
.pad{padding:14px}
.hallcard{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line2)}
.hallcard:last-child{border-bottom:0}
.hbadge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:none;letter-spacing:-.04em}
.hmain{flex:1;min-width:0}
.hmain .nm{font-weight:700;font-size:15px;letter-spacing:-.01em}
.hmain .ds{font-size:12.5px;color:var(--ink2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45}
.chev{color:var(--ink3);font-size:16px;flex:none}

.row{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line2);width:100%;text-align:left;align-items:flex-start}
.row:last-child{border-bottom:0}
.row .st{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;font-weight:700;
  background:var(--chip);color:var(--ink2);padding:3px 6px;border-radius:7px;flex:none;margin-top:1px;white-space:nowrap}
.row .bd{flex:1;min-width:0}
.row .nm{font-weight:650;font-size:14.5px;letter-spacing:-.01em;word-break:break-word;line-height:1.35}
.row .mt{font-size:12px;color:var(--ink2);margin-top:3px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.row .rt{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-top:1px}

.tag{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--chip);color:var(--ink2);white-space:nowrap}
.tag.sang{background:rgba(184,50,44,.12);color:var(--accent)}
.tag.jung{background:rgba(224,123,26,.14);color:#a65c10}
.tag.ferm{background:rgba(47,125,79,.13);color:var(--ok)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.jung{color:var(--accent2)}}
.star{font-size:17px;line-height:1;color:var(--line);padding:2px}
.star.on{color:#e8a020}
.scorepill{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:20px;background:var(--accent);color:#fff}

/* ---- chips ---- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 3px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:20px;
  background:var(--card);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{opacity:.6;margin-left:3px;font-weight:700}

/* ---- booth detail ---- */
.bhero{padding:16px 14px}
.bhero h1{margin:0;font-size:20px;line-height:1.3;letter-spacing:-.02em;word-break:break-word}
.bhero .loc{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bigst{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:800;
  background:var(--ink);color:var(--bg);padding:4px 9px;border-radius:8px}
.kv{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv dt{flex:none;width:56px;color:var(--ink3);font-size:12px;font-weight:600;padding-top:1px}
.kv dd{margin:0;flex:1;min-width:0;word-break:break-word;line-height:1.5}
.brief{font-size:14px;line-height:1.72;color:var(--ink);word-break:keep-all}

/* score */
.scorerow{display:flex;gap:6px}
.sbtn{flex:1;padding:11px 2px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);
  text-align:center;font-weight:800;font-size:16px;color:var(--ink3);transition:.12s}
.sbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.slabels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3);margin-top:6px}
.scorenow{font-size:12.5px;color:var(--ink2);margin-top:7px;font-weight:600;min-height:18px}

/* checks */
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ck{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:11px;
  border:1.5px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600;text-align:left}
.ck .bx{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px;color:transparent}
.ck.on{border-color:var(--ok);background:rgba(47,125,79,.08)}
.ck.on .bx{background:var(--ok);border-color:var(--ok);color:#fff}

/* dept */
.depts{display:flex;flex-wrap:wrap;gap:7px}
.dchip{font-size:13px;font-weight:600;padding:8px 13px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);color:var(--ink2)}
.dchip.on{background:var(--blue);border-color:var(--blue);color:#fff}

textarea.memo{width:100%;min-height:96px;padding:12px;border-radius:11px;border:1px solid var(--line);
  background:var(--bg);resize:vertical;font-size:15px;line-height:1.6;outline:none}
textarea.memo:focus{border-color:var(--accent)}

/* photos */
.photos{display:flex;gap:9px;flex-wrap:wrap}
.ph{position:relative;width:96px;height:66px;border-radius:10px;overflow:hidden;background:var(--chip);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .del{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;
  background:rgba(0,0,0,.62);color:#fff;font-size:11px;display:grid;place-items:center}
.ph .up{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;font-size:10px;
  display:grid;place-items:center;font-weight:700}
.addph{width:96px;height:66px;border-radius:10px;border:1.5px dashed var(--line);display:grid;place-items:center;
  color:var(--ink3);font-size:11.5px;font-weight:600;text-align:center;line-height:1.3;background:var(--card)}

/* board */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;box-shadow:var(--sh)}
.stat .v{font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--ink3);margin-top:3px;font-weight:600}
.stat.tap{text-align:left;width:100%;transition:.12s;cursor:pointer}
.stat.tap.on{background:var(--ink);border-color:var(--ink)}
.stat.tap.on .v,.stat.tap.on .l{color:var(--bg)}
.bar{height:6px;border-radius:4px;background:var(--line2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}

/* tabbar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:var(--safe)}
.tabs .in{max-width:820px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab .ic{font-size:19px;display:block;line-height:1.25}
.tab{padding:9px 0 8px;text-align:center;color:var(--ink3);font-size:10.5px;font-weight:650}
.tab .ic{font-size:19px;display:block;line-height:1.25}
.tab.on{color:var(--accent)}

/* sheet */
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.sheetbg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--card);
  border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .24s cubic-bezier(.3,.8,.3,1);
  max-height:84vh;overflow-y:auto;padding-bottom:calc(16px + var(--safe));box-shadow:0 -6px 30px rgba(0,0,0,.2);
  overscroll-behavior:contain}
@supports (height:1dvh){.sheet{max-height:84dvh}}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:9px auto 4px}
.sheet .inner{max-width:820px;margin:0 auto;padding:6px 18px 0}

.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--ink);color:var(--bg);
  font-weight:700;font-size:15px;text-align:center;margin-top:14px}
.btn.alt{background:var(--chip);color:var(--ink)}
.btn.acc{background:var(--accent);color:#fff}

.note{font-size:12px;color:var(--ink3);line-height:1.6}
.empty{text-align:center;padding:44px 20px;color:var(--ink3);font-size:13.5px;line-height:1.7}
.banner.ro{background:rgba(184,50,44,.1);color:var(--accent);border-color:rgba(184,50,44,.3)}
.banner{margin:12px 0;padding:11px 13px;border-radius:11px;font-size:12.5px;line-height:1.55;
  background:rgba(224,123,26,.12);color:#8a4c08;border:1px solid rgba(224,123,26,.28)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .banner{color:var(--accent2)}}



/* ---- 프로그램 ---- */
.dayhdr{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:12px 14px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;box-shadow:var(--sh)}
.dayhdr.on{margin-bottom:8px}
.dayhdr b{font-size:14.5px;font-weight:750;letter-spacing:-.01em}
.dayhdr .cnt{margin-left:auto;font-size:11.5px;color:var(--ink3);font-weight:650}
.dayhdr .arr{color:var(--ink3);font-size:12px}
.todaytag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;background:var(--accent);color:#fff}
.row.trow .nm{font-size:14px;line-height:1.4}
.row.trow.now{background:rgba(184,50,44,.06)}
.row.trow .st{font-variant-numeric:tabular-nums}


/* ---- 로그인 ---- */
#authwrap{position:fixed;inset:0;z-index:999;background:var(--bg);display:grid;place-items:center;padding:24px}
.authbox{width:100%;max-width:340px;text-align:center}
.authci{width:72px;height:auto;display:block;margin:0 auto 20px}
.authbox h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.authsub{margin:6px 0 22px;font-size:13px;color:var(--ink3)}
.autherr{margin:0 0 14px;padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.5;
  background:rgba(184,50,44,.1);color:var(--accent);text-align:left}
#authwrap input{width:100%;padding:13px 14px;margin-bottom:9px;border-radius:11px;
  border:1px solid var(--line);background:var(--card);font-size:16px;outline:none}
#authwrap input:focus{border-color:var(--accent)}
.authbtn{width:100%;padding:14px;border-radius:12px;background:var(--accent);color:#fff;
  font-weight:700;font-size:15px;margin-top:6px}
.authbtn:disabled{opacity:.6}
.authlink{width:100%;padding:12px;margin-top:8px;font-size:13px;color:var(--ink3);font-weight:600;background:none}

/* ---- 앱 소개 ---- */
.intro{padding:22px 4px 24px;text-align:center}
.intro .ci{width:84px;height:auto;display:block;margin:10px auto 22px}
.intro .ev{font-size:25px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.intro .dt{margin-top:9px;font-size:15px;font-weight:700;color:var(--ink)}
.intro .pl{margin-top:4px;font-size:12.5px;color:var(--ink3)}
.intro .dd{display:inline-block;margin-top:13px;padding:5px 13px;border-radius:20px;
  background:var(--accent);color:#fff;font-size:12.5px;font-weight:800;letter-spacing:.02em}
.intro .line{height:1px;background:var(--line);margin:26px 10px}
.intro h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.intro .lead{margin:11px 6px 0;font-size:14px;line-height:1.75;color:var(--ink2);word-break:keep-all}
.intro .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:22px}
.intro .nums div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 4px;box-shadow:var(--sh)}
.intro .nums b{display:block;font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.intro .nums span{display:block;font-size:11px;color:var(--ink3);margin-top:3px;font-weight:650}
.intro .how{margin-top:22px;text-align:left;display:grid;gap:10px}
.intro .how div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 15px;box-shadow:var(--sh);display:grid;grid-template-columns:30px 1fr;
  grid-template-rows:auto auto;column-gap:10px;align-items:center}
.intro .how i{grid-row:1/3;font-style:normal;font-size:21px;color:var(--accent);text-align:center}
.intro .how b{font-size:14.5px;font-weight:750;letter-spacing:-.01em}
.intro .how p{margin:4px 0 0;font-size:12.5px;line-height:1.6;color:var(--ink2);word-break:keep-all}

/* ---- 홀 도면 ---- */
.gmap{background:var(--card);margin-top:10px;position:relative;overflow:hidden}
.gmap .mapin{position:absolute;inset:0;width:100%;height:100%}
.gmap svg{display:block;width:100%;height:100%}
.gmap.big{width:100%;max-height:70vh;min-height:300px}
.gmap.small{width:100%;max-height:34vh;min-height:180px}
@supports (height:1dvh){.gmap.big{max-height:70dvh}.gmap.small{max-height:34dvh}}
.mapwrap{touch-action:pan-y;overscroll-behavior:contain}
.mapwrap.zoomed{touch-action:none}
polygon.bt{fill:var(--line2);stroke:var(--line);stroke-width:.6;vector-effect:non-scaling-stroke}
polygon.k0{fill:#b9b2a5;stroke:#8d8577;cursor:pointer}
polygon.k2{fill:var(--accent2);fill-opacity:.55;stroke:var(--accent2);cursor:pointer}
polygon.k1{fill:var(--accent);fill-opacity:.7;stroke:var(--accent);cursor:pointer}
polygon.mk{stroke:#e8a020;stroke-width:2.2}
polygon.sel{fill:#1b8a4b;fill-opacity:1;stroke:#0d3d22;stroke-width:3}
.glegend{position:absolute;left:8px;bottom:8px;display:flex;gap:9px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 8px;
  font-size:10px;color:var(--ink2);box-shadow:var(--sh);z-index:4}
.glegend span{display:flex;align-items:center;gap:3px;white-space:nowrap}
.glegend i{width:9px;height:9px;border-radius:2px;display:block}
.glegend i.bt{background:var(--line2);border:1px solid var(--line)}
.glegend i.k0{background:#b9b2a5}
.glegend i.k2{background:var(--accent2);opacity:.7}
.glegend i.k1{background:var(--accent)}
polygon.zf{fill-opacity:.24;pointer-events:none}
polygon.zl{fill:none;stroke-width:3;stroke-opacity:.95;vector-effect:non-scaling-stroke;pointer-events:none}
.zpill{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;border-radius:6px;font-size:11px;font-weight:800;color:#fff;margin-right:5px;padding:0 4px}
polygon.tap{cursor:pointer}
polygon.xn{fill:#6f9fd8;fill-opacity:.55;stroke:#2a5d9f}
.tag.iv{background:rgba(27,138,75,.14);color:#1b8a4b}
.tag.su{background:rgba(42,93,159,.14);color:var(--blue)}
.maptoggle{display:flex;gap:8px;align-items:center;margin-top:12px}
.maptoggle button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);font-size:12.5px;font-weight:650;color:var(--ink2)}
.maptoggle button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.hide{display:none!important}
</style>

<div class="top"><div class="in" id="topbar"></div></div>
<div class="wrap" id="view"></div>
<nav class="tabs"><div class="in" id="tabbar"></div></nav>
<div class="sheetbg" id="shbg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="inner" id="shin"></div></div>
<input type="file" id="cam" accept="image/*" capture="environment" class="hide">
<script>
"use strict";
/* ============ 상수 ============ */
const HALLS=["4","5A","1","2","3","6A","6","4A","7","5B","8","5C"];
const SCORE_LABEL={1:"관심 없음",2:"참고",3:"흥미로움",4:"개발 참고 가치",5:"반드시 후속 검토"};
const CHECKS=[["v","방문 완료"],["t","시식함"],["p","샘플 수령"],["f","팔로업 필요"]];
const CHECKS_T=[["v","참석함"],["t","자료 받음"],["p","발표자 접촉"],["f","팔로업 필요"]];
const SCORE_LABEL_T={1:"관심 없음",2:"참고",3:"흥미로움",4:"개발 참고 가치",5:"반드시 후속 검토"};
const DEFAULT_DEPTS=["우리맛연구실","식품개발연구실","우리발효연구실"];
const OPEN=new Date("2026-10-17T00:00:00+02:00");
const LS="sial26.v1";

/* ============ 상태 ============ */
const S={
  idx:null, halls:null, hall:{}, byId:{}, geo:{}, extra:{}, zone:{}, showZone:false, talks:null, dayOpen:null,
  me:null, meId:null, mine:{b:{}}, team:{}, depts:DEFAULT_DEPTS.slice(),
  db:null, user:null, assets:null, dl:null,
  canWrite:true, online:navigator.onLine, dirty:false, usage:null,
  q:"", hallQ:"", filt:"all", mineFilt:"all", sort:"rec", route:["map"], showMap:true, showBoothMap:true
};

/* ============ 유틸 ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hcolor=h=>{const v=(S.halls&&S.halls[h])||{};const n=v.n||0;
  return n>=250?"var(--accent)":n>=100?"var(--accent2)":"#6b6459";};
function dday(){const d=Math.ceil((OPEN-new Date())/864e5);return d>0?"D-"+d:d===0?"D-DAY":"개최 중/종료";}
function debounce(f,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms);};}

/* ============ IndexedDB (캐시 + 사진) ============ */
let _idb=null;
function idb(){ if(_idb)return _idb;
  _idb=new Promise((res,rej)=>{ let r;
    try{ r=indexedDB.open("sial26",1);}catch(e){return res(null);}
    r.onupgradeneeded=()=>{const d=r.result;
      if(!d.objectStoreNames.contains("kv"))d.createObjectStore("kv");
      if(!d.objectStoreNames.contains("ph"))d.createObjectStore("ph");};
    r.onsuccess=()=>res(r.result); r.onerror=()=>res(null);
  }); return _idb;
}
async function kvGet(store,k){ const d=await idb(); if(!d)return null;
  return new Promise(r=>{try{const q=d.transaction(store).objectStore(store).get(k);
    q.onsuccess=()=>r(q.result??null);q.onerror=()=>r(null);}catch(e){r(null);}}); }
async function kvSet(store,k,v){ const d=await idb(); if(!d)return;
  return new Promise(r=>{try{const t=d.transaction(store,"readwrite");t.objectStore(store).put(v,k);
    t.oncomplete=()=>r();t.onerror=()=>r();}catch(e){r();}}); }
async function kvDel(store,k){ const d=await idb(); if(!d)return;
  return new Promise(r=>{try{const t=d.transaction(store,"readwrite");t.objectStore(store).delete(k);
    t.oncomplete=()=>r();t.onerror=()=>r();}catch(e){r();}}); }

/* ============ 데이터 로딩 (네트워크 → 캐시 폴백) ============ */
async function loadJSON(file){
  try{
    const r=await fetch(file,{cache:"force-cache"});
    if(!r.ok) throw 0;
    const j=await r.json();
    kvSet("kv","f:"+file,j);
    return j;
  }catch(e){
    const c=await kvGet("kv","f:"+file);
    if(c) return c;
    throw new Error("데이터를 불러오지 못했습니다 ("+file+")");
  }
}
async function needHalls(){ if(!S.halls) S.halls=await loadJSON("halls.json"); return S.halls; }
async function needIdx(){ if(!S.idx){ S.idx=await loadJSON("index.json");
    S.idx.forEach(x=>{S.byId[x.i]=x;}); } return S.idx; }
async function needHall(h){ if(!S.hall[h]){ const d=await loadJSON("hall-"+h+".json");
    S.hall[h]=d; d.forEach(b=>{S.byId[b.id]=Object.assign(S.byId[b.id]||{},{full:b});}); }
  return S.hall[h]; }
async function getBooth(id){
  if(S.byId[id]&&S.byId[id].full) return S.byId[id].full;
  await needIdx();
  const meta=S.byId[id]; if(!meta) return null;
  await needHall(meta.h||"NA");
  return (S.byId[id]&&S.byId[id].full)||null;
}

/* ============ 로컬 미러 ============ */
function lsLoad(){ try{const j=JSON.parse(localStorage.getItem(LS)||"null");
  if(j&&j.b) S.mine=j; if(j&&j.depts) S.depts=j.depts;}catch(e){} }
function lsSave(){ try{localStorage.setItem(LS,JSON.stringify({b:S.mine.b,depts:S.depts,t:Date.now()}));}catch(e){} }

/* ============ 캡슐 초기화 ============ */
async function initCaps(){
  if(!window.claude||!claude.use) return;
  const [db,user,assets,dl]=await Promise.all([
    claude.use("db").catch(()=>null), claude.use("user").catch(()=>null),
    claude.use("assets").catch(()=>null), claude.use("downloads").catch(()=>null)]);
  S.db=db; S.user=user; S.assets=assets; S.dl=dl;
  if(user){ try{ S.meId=await user.id(); S.me=await user.me(); }catch(e){}
            try{ const c=await user.can("data.write"); S.canWrite=(c===false)?false:(c===true?true:S.canWrite); }catch(e){}
            paintSync(); }
  if(db&&S.meId){
    try{ const s=await db.doc("notes/"+S.meId).get(); const d=s&&s.exists?s.data():null;
         if(d&&d.b){ S.mine=mergeMine(S.mine,d); lsSave(); } }catch(e){}
    try{ const s=await db.doc("config/depts").get(); const c=s&&s.exists?s.data():null;
         if(c&&Array.isArray(c.list)&&c.list.length){ S.depts=c.list.slice(); lsSave(); } }catch(e){}
    try{ db.doc("config/depts").onSnapshot(s=>{ const c=s&&s.exists?s.data():null;
         if(c&&Array.isArray(c.list)&&c.list.length){ S.depts=c.list.slice(); lsSave();
           if(S.route[0]==="booth"||S.route[0]==="settings") render(); } },()=>{}); }catch(e){}
  }
  if(S.assets){ S.assets.list().then(r=>{S.usage=r.usage;}).catch(()=>{}); }
  flushPhotos();
}
function mergeMine(local,remote){
  const out={b:Object.assign({},remote.b||{})};
  for(const k in (local.b||{})){
    const a=local.b[k];
    if(!out.b[k] || (a.u||0) >= ((out.b[k].u)||0)) out.b[k]=a;
  }
  return out;
}

/* ============ 저장 ============ */
const saveRemote=debounce(async()=>{
  if(!S.db||!S.meId){S.dirty=true;return;}
  try{ await S.db.doc("notes/"+S.meId).set({b:S.mine.b,u:Date.now()}); S.dirty=false; }
  catch(e){ S.dirty=true; }
  paintSync();
},700);
function entry(id){ if(!S.mine.b[id]) S.mine.b[id]={}; return S.mine.b[id]; }
function touch(id){ const e=entry(id); e.u=Date.now();
  const empty=!e.note&&!e.star&&!e.s&&!(e.d||[]).length&&!Object.keys(e.c||{}).length
    &&!(e.m||"").trim()&&!(e.p||[]).length&&!(e.nm||"").trim();
  if(empty) delete S.mine.b[id];
  lsSave(); saveRemote(); paintSync(); }
function paintSync(){ const el=document.getElementById("syncdot");
  if(el){
    el.textContent = (S.canWrite===false) ? "읽기 전용" : (S.dirty ? "미동기" : (S.db?"동기화됨":"로컬 저장"));
    el.style.color = (S.canWrite===false||S.dirty) ? "var(--accent)" : "var(--ink3)";
  }
  const v=document.getElementById("view");
  if(v && S.canWrite===false && !document.getElementById("rob")){
    const d=document.createElement("div"); d.id="rob"; d.className="banner ro";
    d.innerHTML='<b>읽기 전용으로 열렸습니다.</b><br>기록은 이 기기에만 저장되고 <b>팀에 공유되지 않습니다.</b>'
      +' 공유 설정에서 <b>편집</b> 권한을 받아야 합니다.';
    v.insertBefore(d, v.firstChild);
  }
  if(S.canWrite!==false){ const b=document.getElementById("rob"); if(b) b.remove(); }
}

/* ============ 사진 ============ */
function compress(file){ return new Promise((res,rej)=>{
  const img=new Image(), u=URL.createObjectURL(file);
  img.onload=()=>{ URL.revokeObjectURL(u);
    const M=1400, sc=Math.min(1,M/Math.max(img.width,img.height));
    const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
    const c=document.createElement("canvas"); c.width=w; c.height=h;
    c.getContext("2d").drawImage(img,0,0,w,h);
    c.toBlob(b=>b?res(b):rej(new Error("압축 실패")),"image/jpeg",0.75);
  };
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("이미지를 읽지 못했습니다"));};
  img.src=u;
});}
async function addPhoto(boothId,file){
  let blob; try{ blob=await compress(file); }catch(e){ askConfirm(e.message||"사진을 처리하지 못했습니다.",()=>{},"확인"); return; }
  const tmp="t"+Date.now()+Math.random().toString(36).slice(2,7);
  await kvSet("ph",tmp,blob);
  const e=entry(boothId); e.p=e.p||[]; e.p.push({k:tmp,pending:1});
  touch(boothId); render();
  flushPhotos();
}
let _flushing=false;
async function flushPhotos(){
  if(_flushing||!S.assets)return; _flushing=true;
  try{
    for(const bid in S.mine.b){
      const ph=S.mine.b[bid].p||[];
      for(const p of ph){
        if(!p.pending)continue;
        const blob=await kvGet("ph",p.k);
        if(!blob){ p.pending=0; p.gone=1; continue; }
        try{ const r=await S.assets.upload(blob,{type:"image/jpeg"});
             p.id=r.id; p.pending=0;
             S.mine.b[bid].u=Date.now(); lsSave(); saveRemote();
             S.assets.list().then(x=>{S.usage=x.usage;}).catch(()=>{});
        }catch(err){
          if(err&&(err.code==="quota_or_state"||err.code==="too_large")){ p.err=err.code; p.pending=0; }
          else { _flushing=false; return; }   /* 네트워크/레이트 — 다음 기회에 */
        }
      }
    }
  } finally { _flushing=false; if(S.route[0]==="booth")render(); }
}
async function photoURL(p){
  if(p.k){ const b=await kvGet("ph",p.k); if(b) return URL.createObjectURL(b); }
  if(p.id && window.claude && claude.blobURL){ const u=await claude.blobURL(p.id); if(u) return u; }
  return null;
}
async function delPhoto(boothId,i){
  const e=entry(boothId), p=(e.p||[])[i]; if(!p)return;
  askConfirm("이 사진을 삭제할까요?",()=>delPhoto2(boothId,i)); }
async function delPhoto2(boothId,i){
  const e=entry(boothId), p=(e.p||[])[i]; if(!p)return;
  if(p.k) kvDel("ph",p.k);
  if(p.id&&S.assets){ try{ await S.assets.delete(p.id); }catch(err){} }
  e.p.splice(i,1); touch(boothId); render();
}
</script>
<script>
/* ============ 라우터 ============ */
function go(...r){ location.hash="#/"+r.join("/"); }
function parseHash(){ const h=(location.hash||"#/map").replace(/^#\/?/,"");
  const p=h.split("/").filter(Boolean); return p.length?p:["map"]; }
window.addEventListener("hashchange",()=>{ S.route=parseHash(); window.scrollTo(0,0); render(); });

/* ============ 공통 조각 ============ */
function relTag(r){ return r==="상"?'<span class="tag sang">핵심 분류</span>':r==="중"?'<span class="tag jung">인접 분류</span>':""; }
function fermTag(b){ const f=b.ferm||b.f;
  return (f==="핵심")?'<span class="tag ferm">발효 핵심</span>':(f==="부분")?'<span class="tag ferm">발효 부분</span>':""; }
function rowHTML(o){
  const id=o.i||o.id, nm=o.n||o.exh, st=o.s||o.stand||"", cat=o.c||o.cat||"";
  const e=S.mine.b[id]||{};
  return '<button class="row" onclick="go(\'booth\',\''+id+'\')">'
    +'<span class="st">'+esc(st||"—")+'</span><span class="bd">'
    +'<span class="nm">'+esc(nm)+'</span>'
    +'<span class="mt">'
    +((S.sort==="zone"&&(o.zi||o.zone))?'<span class="zpill" style="background:'+ZC[((o.zi||o.zone)-1)%5]+'">'+(o.zi||o.zone)+'</span>':'')
    +relTag(o.r||o.rel)+fermTag(o)
    +((o.iv||o.innov)?'<span class="tag iv">SIAL Innovation</span>':'')
    +((o.su||o.startup)?'<span class="tag su">Startup</span>':'')
    +'<span class="tag">'+esc(cat)+'</span>'
    +((e.d||[]).length?'<span class="tag" style="background:rgba(42,93,159,.14);color:var(--blue)">'+esc(e.d.join(" · "))+'</span>':"")
    +((e.c&&e.c.v)?'<span class="tag" style="background:rgba(47,125,79,.13);color:var(--ok)">방문</span>':"")
    +'</span></span><span class="rt">'
    +(e.star?'<span class="star on">★</span>':'')
    +(e.s?'<span class="scorepill">'+e.s+'</span>':'')
    +((e.m||"").trim()?'<span class="tag">메모</span>':'')
    +'</span></button>';
}
function listWrap(rows,limit){
  if(!rows.length) return '<div class="empty">결과가 없습니다.</div>';
  const shown=rows.slice(0,limit||300);
  return '<div class="card">'+shown.join("")+'</div>'
    +(rows.length>shown.length?'<p class="note" style="text-align:center;margin:12px 0">'
      +shown.length+' / '+rows.length+'건 표시 — 검색어를 좁혀 주세요.</p>':'');
}
function score(o){ const id=o.i||o.id, e=S.mine.b[id]||{};
  const r=(o.r||o.rel)==="상"?0:(o.r||o.rel)==="중"?1:2;
  return [ e.star?0:1, e.s?-(e.s):1, r, o.a||"ZZ", o.o||9999 ]; }
function cmpArr(a,b){ for(let i=0;i<a.length;i++){ if(a[i]<b[i])return -1; if(a[i]>b[i])return 1; } return 0; }

/* ============ 검색 ============ */
function matches(o,q){
  if(!q)return true;
  const t=(o.n+" "+o.s+" "+o.c+" "+o.q).toLowerCase();
  return q.split(/\s+/).filter(Boolean).every(w=>t.includes(w));
}

/* ============ 뷰: 지도 ============ */
let MZ={s:1,x:0,y:0};
async function viewMap(){
  await needHalls();
  $("#topbar").innerHTML='<div style="flex:1"><div class="ttl">SIAL Paris 2026</div>'
    +'<div class="sub">10/17–21 · Paris Nord Villepinte · '+dday()+'</div></div>'
    +'<div class="sub" id="syncdot"></div>';
  const M=S.halls._map;
  const pins=HALLS.filter(h=>S.halls[h]&&S.halls[h].xy).map(h=>{
    const v=S.halls[h], sz=Math.max(34,Math.min(50,26+v.n/18));
    return '<span class="pin" style="left:'+(v.xy[0]/M.w*100)+'%;top:'+(v.xy[1]/M.h*100)+'%;'
      +'width:'+sz+'px;height:'+sz+'px;font-size:'+(sz*.36)+'px;background:'+hcolor(h)+'" '
      +'onclick="hallSheet(\''+h+'\')"><b>'+h+'</b><i>'+v.n+'곳</i></span>';
  }).join("");
  const cards=HALLS.filter(h=>S.halls[h]).map(h=>{ const v=S.halls[h];
    return '<button class="hallcard" onclick="hallSheet(\''+h+'\')">'
      +'<span class="hbadge" style="background:'+hcolor(h)+'">'+h+'</span>'
      +'<span class="hmain"><span class="nm">홀 '+h+'</span>'
      +'<span class="ds">'+v.cats.slice(0,3).map(c=>esc(c[0])).join(" · ")
      +(v.ferm_maker?' <span style="color:var(--ok)">· 발효 '+v.ferm_maker+'</span>':'')+'</span></span>'
      +'<span class="rt" style="display:flex;flex:none;flex-direction:column;align-items:flex-end;gap:3px">'
      +'<span style="font-size:15px;font-weight:800;letter-spacing:-.02em">'+v.n+'<span class="sub" style="font-weight:600">곳</span></span></span>'
      +'<span class="chev">›</span></button>';
  }).join("");
  const q=S.q.trim().toLowerCase();
  let results="";
  if(q){ await needIdx();
    const hit=S.idx.filter(o=>matches(o,q)).sort((a,b)=>cmpArr(score(a),score(b)));
    results='<div class="sect">전체 검색 — '+hit.length+'건</div>'+listWrap(hit.map(rowHTML),200);
  }
  $("#view").innerHTML=
    '<div class="sbox'+(S.q?' has':'')+'"><span class="ic">⌕</span>'
    +'<input id="gq" placeholder="출품사명 · 부스번호 · 품목 · 브랜드 검색" value="'+esc(S.q)+'" autocomplete="off">'
    +'<button class="clr" onclick="S.q=\'\';render()">✕</button></div>'
    + (q? results :
      '<div class="mapwrap" id="mw"><div class="mapin" id="mw-in"><img src="map.png" alt="SIAL 도면">'+pins+'</div>'
      +'<div class="mzoom"><button onclick="mzoom(\'mw\',1.4)">+</button><button onclick="mzoom(\'mw\',1/1.4)">−</button>'
      +'<button onclick="mreset(\'mw\')" style="font-size:12px">⤢</button></div></div>'
      +'<p class="maphint">홀을 눌러 부스 목록으로 · 두 손가락으로 확대</p>'
      +'<div class="sect">홀 목록 — DB 등재 출품사 수</div><div class="card">'+cards+'</div>'
      +'<p class="note" style="margin:14px 2px 0">DB 등재 출품사 '+(S.idx?S.idx.length:2805)+'곳. '
      +'분류 표시는 우리 8개 분류와의 일치 여부이며 부스별 개별 검증 결과는 아닙니다. '
      +'홀 7은 핵심 분류는 적지만 치즈·유제품 발효 제조사가 147곳으로 가장 많습니다.</p>');
  const gq=$("#gq");
  if(gq){ gq.oninput=debounce(e=>{S.q=e.target.value;render();},200); }
  if(!q) bindPan("mw");
  restoreFocus(); paintSync();
}
let _foc=null;
function keepFocus(){ const a=document.activeElement;
  if(a&&["gq","hq","nd","memo"].includes(a.id)){ let p=null; try{p=a.selectionStart;}catch(e){}
    _foc={id:a.id,p:p}; } }
function restoreFocus(){ if(!_foc)return; const f=_foc; _foc=null;
  const el=document.getElementById(f.id); if(!el)return;
  el.focus(); if(f.p!=null){ try{el.setSelectionRange(f.p,f.p);}catch(e){} } }
const PZ={};
function pz(k){ return PZ[k]||(PZ[k]={s:1,x:0,y:0}); }
function mzoom(k,f){ const z=pz(k); z.s=Math.max(1,Math.min(8,z.s*f)); clampPan(k); applyPan(k); }
function mreset(k){ PZ[k]={s:1,x:0,y:0}; applyPan(k); }
function applyPan(k){ const el=document.getElementById(k+"-in"); const z=pz(k);
  if(el) el.style.transform="translate("+z.x+"px,"+z.y+"px) scale("+z.s+")";
  const w=document.getElementById(k);
  if(w) w.classList.toggle("zoomed", z.s>1.02); }
function clampPan(k){ const w=document.getElementById(k); if(!w)return; const z=pz(k);
  const W=w.clientWidth,H=w.clientHeight;
  z.x=Math.min(0,Math.max(W-W*z.s,z.x)); z.y=Math.min(0,Math.max(H-H*z.s,z.y)); }
function bindPan(k){
  const w=document.getElementById(k); if(!w||w.dataset.bound)return; w.dataset.bound="1";
  const pts=new Map(); let st=null, dragged=false;
  w.addEventListener("pointerdown",e=>{
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const z=pz(k);
    if(pts.size===1){ st={x:e.clientX,y:e.clientY,ox:z.x,oy:z.y}; dragged=false; }
    if(pts.size===2){ const a=[...pts.values()];
      st={pinch:1,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),s:z.s,
          cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2,ox:z.x,oy:z.y}; dragged=true; }
  });
  w.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId)||!st)return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const a=[...pts.values()], z=pz(k);
    if(a.length>=2&&st.pinch){
      const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); if(!d)return;
      const ns=Math.max(1,Math.min(8,st.s*d/st.d));
      const r=w.getBoundingClientRect(), px=st.cx-r.left, py=st.cy-r.top;
      z.x=px-(px-st.ox)*(ns/st.s); z.y=py-(py-st.oy)*(ns/st.s); z.s=ns;
      clampPan(k); applyPan(k); e.preventDefault();
    } else if(a.length===1&&!st.pinch&&z.s>1){
      const dx=a[0].x-st.x, dy=a[0].y-st.y;
      if(!dragged&&Math.abs(dx)+Math.abs(dy)<7)return;
      dragged=true; z.x=st.ox+dx; z.y=st.oy+dy; clampPan(k); applyPan(k); e.preventDefault();
    }
  },{passive:false});
  const up=e=>{ pts.delete(e.pointerId); const z=pz(k);
    if(!pts.size) st=null;
    else if(pts.size===1){ const a=[...pts.values()][0]; st={x:a.x,y:a.y,ox:z.x,oy:z.y}; } };
  w.addEventListener("pointerup",up); w.addEventListener("pointercancel",up);
  w.addEventListener("click",e=>{ if(dragged){ e.stopPropagation(); e.preventDefault(); dragged=false; } },true);
  w.addEventListener("wheel",e=>{ e.preventDefault(); mzoom(k,e.deltaY<0?1.12:1/1.12); },{passive:false});
  applyPan(k);
}

    Z.z.forEach(zz=>{ const c=ZC[zz.c];

      if(r==="상"||r==="중") ztop+='<polygon class="bt '+(r==="상"?"k1":"k2")+'" points="'+b.p+'"'
        +' onclick="go(\'booth\',\''+b.i+'\')"><title>'+esc(b.s)+'</title></polygon>'; });
    Z.z.forEach(zz=>{ const c=ZC[zz.c];
      const up=(zz.by>g.h-70);                       // 아래 가장자리면 라벨을 위로
      const ly=up?(zz.by-41):(zz.by+20), ty=up?(zz.by-26):(zz.by+35);
      zbadge+='<g class="zb">'
        +'<rect x="'+(zz.bx-31)+'" y="'+ly+'" width="62" height="22" rx="7" fill="#fff" stroke="'+c+'" stroke-width="2.5"/>'
        +'<text x="'+zz.bx+'" y="'+ty+'" text-anchor="middle" font-size="13" font-weight="700" fill="#3a362f">'+esc(zz.k)+' · '+zz.n+'</text>'
        +'<circle cx="'+zz.bx+'" cy="'+zz.by+'" r="17" fill="'+c+'" stroke="#fff" stroke-width="4"/>'
        +'<text x="'+zz.bx+'" y="'+(zz.by+6)+'" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">'+zz.i+'</text>'
        +'</g>'; });
  }
  const bo=g.b.map(b=>{
    let cls="bt", extra="";
    if(b.i){ const o=S.byId[b.i]||{}, e=S.mine.b[b.i]||{};
      const r=(o.full&&o.full.rel)||o.r;
      cls+= r==="상"?" k1": r==="중"?" k2":" k0";
      if(e.star||e.s) cls+=" mk";
      if(b.i===sel) cls+=" sel";
      extra=' onclick="go(\'booth\',\''+b.i+'\')"';
    } else {
      const k=xkey(h,b.c), e=S.mine.b[k]||{};
      if(S.mine.b[k]) cls+=" xn";
      if(e.star||e.s) cls+=" mk";
      if(k===sel) cls+=" sel";
      cls+=" tap";
      extra=' onclick="go(\'x\',\''+h+'\',\''+b.c+'\')"';
    }
    return '<polygon class="'+cls+'" points="'+b.p+'"'+extra+'><title>'+esc(b.s)+'</title></polygon>';
  }).join("");
  const M=Math.max(g.w,g.h)*0.075;
  const vb=(-M)+' '+(-M)+' '+(g.w+M*2)+' '+(g.h+M*2);
  const ar=Math.min(1.35,Math.max(0.56,(g.w+M*2)/(g.h+M*2)));

    +'<svg viewBox="'+vb+'" preserveAspectRatio="xMidYMid meet">'

    +(id==="gm"?'<div class="glegend"><span><i class="k1"></i>핵심</span><span><i class="k2"></i>인접</span>'
      +'<span><i class="k0"></i>그 외 DB</span><span><i class="bt"></i>미등재</span></div>':'')+'</div>';
}

function talkOf(tid){ const L=(S.talks&&S.talks.list)||[]; return L.find(x=>x.id===tid)||null; }
function recMeta(id){
  const e=S.mine.b[id]||{};
  if(id.startsWith("t_")){ const t=talkOf(id.slice(2));
    return {kind:"talk", n:(t?t.t:"세션"), s:(t&&t.s?t.s:"세션"), h:"5A",
            c:(t&&t.d?t.d.slice(5).replace("-","/")+" "+t.w:"SIAL Talks"), r:"", a:"ZZ", o:9997}; }
  if(id.startsWith("n_")) return {kind:"note", n:e.nm||"(제목 없는 메모)", s:"메모", h:e.hl||"", c:"현장 메모", r:"", a:"ZZ", o:9999};
  if(id.startsWith("x_")){ const pp=id.split("_");
    return {kind:"x", n:e.nm||("부스 "+(e.st||pp[2])), s:e.st||pp[2], h:e.hl||pp[1], c:"조사 DB 밖", r:"", a:"ZZ", o:9998}; }
  const o=S.byId[id]; if(!o) return null;
  return {kind:"db", n:o.n, s:o.s, h:o.h, c:o.c, r:o.r, iv:o.iv, su:o.su, f:o.f, a:o.a, o:o.o};
}

function zoomTo(k){
  const w=document.getElementById(k), pg=document.querySelector('#'+k+'-in polygon.sel');
  if(!w||!pg) return;
  PZ[k]={s:1,x:0,y:0}; applyPan(k);
  const wr=w.getBoundingClientRect(), pr=pg.getBoundingClientRect();
  if(!wr.width||!pr.width) return;
  const cx=pr.left+pr.width/2-wr.left, cy=pr.top+pr.height/2-wr.top;
  const sc=Math.min(7,Math.max(2.2, wr.width/Math.max(pr.width*9,1)));
  const z=pz(k); z.s=sc; z.x=wr.width/2-cx*sc; z.y=wr.height/2-cy*sc;
  clampPan(k); applyPan(k);
}

async function needTalks(){ if(!S.talks){ try{ S.talks=await loadJSON("talks.json"); }catch(e){ S.talks={list:[],n:0}; } } return S.talks; }
function todayKey(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function talkState(t){
  if(!t.d) return "tba";
  const now=new Date(), tk=todayKey();
  if(t.d>tk) return "future"; if(t.d<tk) return "past";
  const hm=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  if(hm<t.s) return "soon"; if(hm<=t.e) return "now"; return "past";
}
function talkRow(t){
  const id="t_"+t.id, e=S.mine.b[id]||{}, st=talkState(t);
  return '<button class="row trow'+(st==="now"?" now":"")+'" onclick="go(\'talk\',\''+t.id+'\')">'
    +'<span class="st">'+(t.s?esc(t.s):"미정")+'</span><span class="bd">'
    +'<span class="nm">'+esc(t.t)+'</span><span class="mt">'
    +(st==="now"?'<span class="tag" style="background:var(--accent);color:#fff">진행 중</span>':'')
    +(st==="soon"?'<span class="tag" style="background:rgba(27,138,75,.14);color:#1b8a4b">예정</span>':'')
    +(t.want?'<span class="tag iv">참석 예정</span>':'')
    +(t.s?'<span class="tag">'+esc(t.s)+'–'+esc(t.e)+'</span>':'<span class="tag">일정 미공개</span>')
    +'</span></span><span class="rt">'
    +(e.star?'<span class="star on">★</span>':'')
    +(e.s?'<span class="scorepill">'+e.s+'</span>':'')
    +((e.m||"").trim()?'<span class="tag">메모</span>':'')
    +'</span></button>';
}
function talkListHTML(){
  const L=(S.talks&&S.talks.list)||[]; if(!L.length) return '';
  const days=[...new Set(L.map(t=>t.d))].sort((x,y)=>(x?x:"9999").localeCompare(y?y:"9999"));
  const tk=todayKey();
  if(S.dayOpen===null) S.dayOpen = days.includes(tk)?tk:(days.find(d=>d&&d>=tk)||days.find(d=>d)||days[0]);
  let out='';
  for(const d of days){
    const inDay=L.filter(t=>t.d===d);
    const lbl=d?(d.slice(5).replace("-","/")+" ("+inDay[0].w+")"):"일정 미공개";
    const open=(S.dayOpen===d), isToday=(d===tk);
    const done=inDay.filter(t=>S.mine.b["t_"+t.id]).length;
    out+='<button class="dayhdr'+(open?" on":"")+'" onclick="S.dayOpen='+(open?'\'\'':'\''+d+'\'')+';render()">'
      +'<b>'+esc(lbl)+'</b>'+(isToday?'<span class="todaytag">오늘</span>':'')
      +'<span class="cnt">'+inDay.length+'개'+(done?' · 기록 '+done:'')+'</span>'
      +'<span class="arr">'+(open?"▾":"▸")+'</span></button>';
    if(open) out+='<div class="card" style="margin:0 0 10px">'+inDay.map(talkRow).join("")+'</div>';
  }
  return out;
}

/* ============ 사진 일괄 내려받기 (ZIP) ============ */
const _crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;
  for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=_crcT[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipBuild(files){                     /* [{name, data:Uint8Array}] — 무압축 저장 */
  const enc=new TextEncoder(); const parts=[]; const dir=[]; let off=0;
  const u16=v=>[v&255,(v>>8)&255], u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255];
  for(const f of files){
    const nm=enc.encode(f.name), crc=crc32(f.data), sz=f.data.length;
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)]);
    parts.push(lh,nm,f.data);
    dir.push({nm,crc,sz,off}); off+=lh.length+nm.length+sz;
  }
  const cd=[]; let cdLen=0;
  for(const d of dir){
    const ch=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),
      ...u32(d.crc),...u32(d.sz),...u32(d.sz),...u16(d.nm.length),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(0),...u32(d.off)]);
    cd.push(ch,d.nm); cdLen+=ch.length+d.nm.length;
  }
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(dir.length),...u16(dir.length),
    ...u32(cdLen),...u32(off),...u16(0)]);
  return new Blob([...parts,...cd,end],{type:"application/zip"});
}
function safeName(s){ return String(s||"").replace(/[\\/:*?"<>|]/g,"").replace(/\s+/g," ").trim().slice(0,40); }
async function exportPhotos(){
  const {all,nameOf}=window.__board||{}; if(!all) return;
  const jobs=[];
  for(const k in all){
    const m=recMeta(k)||{};
    all[k].forEach(x=>{ (x.e.p||[]).forEach((ph,i)=>{
      if(!ph.id && !ph.k) return;
      jobs.push({ph,base:[ (m.h?"홀"+m.h:"장소미정"), safeName(m.s||""), safeName(m.n||"") ]
        .filter(Boolean).join("_")+"_"+(i+1), who:nameOf?nameOf(x.who):"", meta:m, e:x.e});
    }); });
  }
  const btn=document.getElementById("phzip");
  if(!jobs.length){ if(btn) btn.textContent="내려받을 사진이 없습니다"; return; }
  const files=[]; const idx=[["파일명","구분","홀","부스","출품사","기록자","관심도","메모"]];
  for(let n=0;n<jobs.length;n++){
    const j=jobs[n];
    if(btn) btn.textContent="사진 받는 중… "+(n+1)+" / "+jobs.length;
    try{
      const url=await photoURL(j.ph); if(!url) continue;
      const buf=new Uint8Array(await (await fetch(url)).arrayBuffer());
      const name=j.base+".jpg";
      files.push({name,data:buf});
      idx.push([name, j.meta.kind==="note"?"현장 메모":j.meta.kind==="x"?"조사 DB 밖":j.meta.kind==="talk"?"SIAL Talks":"조사 DB",
        j.meta.h||"", j.meta.s||"", j.meta.n||"", j.who, j.e.s||"", (j.e.m||"").replace(/\r?\n/g," ")]);
    }catch(e){}
  }
  if(!files.length){ if(btn) btn.textContent="사진을 받지 못했습니다"; return; }
  const csv="﻿"+idx.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  files.push({name:"목록.csv",data:new TextEncoder().encode(csv)});
  const blob=zipBuild(files);
  const fn="SIAL2026_현장사진_"+new Date().toISOString().slice(0,10)+".zip";
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fn; a.click();
  if(btn) btn.textContent="사진 "+(files.length-1)+"장 내려받기 완료";
}
